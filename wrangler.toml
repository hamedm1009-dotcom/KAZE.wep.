name = "kaze-store"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-27"

[vars]
# Must exactly match Firebase Console > Project settings > Project ID.
FIREBASE_PROJECT_ID = "kaze-store"

[[d1_databases]]
binding = "DB"
database_name = "kaze-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
